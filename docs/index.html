<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Block Smash</title>
    <link rel="manifest" href="manifest.json">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d0d12">
    
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none; 
            -webkit-user-select: none; 
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0d12;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: calc(15px + env(safe-area-inset-top)) 15px calc(15px + env(safe-area-inset-bottom)) 15px;
            touch-action: none;
            position: relative;
        }

        #app-header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .brand-title {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(45deg, #ff5722, #ffeb3b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        #mode-tag {
            font-size: 12px;
            color: #8e8e93;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: -4px;
        }

        .stats-display {
            display: flex;
            gap: 10px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 12px;
            text-align: center;
            min-width: 80px;
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            color: #8e8e93;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        /* Booster Tray Layout styles */
        #booster-dock {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
        }

        .booster-btn {
            flex: 1;
            background: #1e1e28;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 8px;
            color: white;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            position: relative;
        }

        .booster-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .booster-icon {
            font-size: 18px;
        }

        .booster-count {
            font-size: 9px;
            background: rgba(255, 255, 255, 0.15);
            padding: 1px 6px;
            border-radius: 8px;
            color: #ffcc00;
            font-weight: bold;
            margin-top: 2px;
        }

        /* Dynamic Popup Toast Alert */
        #toast-alert {
            position: absolute;
            top: calc(80px + env(safe-area-inset-top));
            background: linear-gradient(135deg, #2c2c3e, #1e1e28);
            border: 1px solid #ffcc00;
            padding: 10px 20px;
            border-radius: 20px;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            z-index: 20;
            display: none;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        #timer-bar-container {
            width: 100%;
            max-width: 400px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-bottom: 10px;
            overflow: hidden;
            display: none;
        }

        #timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #34c759, #ffcc00, #ff3b30);
            transition: width 0.1s linear;
        }

        #canvas-wrapper {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 400 / 580;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            background: #16161e;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }

        #menu-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 13, 18, 0.95);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .menu-title {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 40px;
            background: linear-gradient(45deg, #ff5722, #ffeb3b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .menu-btn {
            width: 100%;
            max-width: 280px;
            background: #1e1e28;
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 18px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 16px;
            margin-bottom: 15px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: transform 0.1s;
        }

        .menu-btn:active {
            transform: scale(0.97);
            background: #252535;
        }

        .menu-btn span {
            font-size: 12px;
            font-weight: 400;
            color: #8e8e93;
        }
    </style>
</head>
<body>

<div id="toast-alert">Item Earned! 🎉</div>

<div id="menu-overlay">
    <h1 class="menu-title">Block Smash</h1>
    <button class="menu-btn" onclick="startGame('classic')">
        Classic Mode
        <span>Relaxed traditional puzzle logic</span>
    </button>
    <button class="menu-btn" onclick="startGame('timed')">
        Timed Mode
        <span>Smash lines to stay alive!</span>
    </button>
    <button class="menu-btn" onclick="startGame('blast')">
        Blast Mode
        <span>Defuse bombs before they blow!</span>
    </button>
</div>

<header id="app-header">
    <div>
        <h1 class="brand-title">Block Smash</h1>
        <div id="mode-tag">Classic</div>
    </div>
    <div class="stats-display">
        <div class="stat-card">
            <div class="stat-label">Score</div>
            <div class="stat-value" id="score">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Best</div>
            <div class="stat-value" id="best">0</div>
        </div>
    </div>
</header>

<div id="booster-dock">
    <button class="booster-btn" id="btn-defuse" onclick="useDefuse()">
        <span class="booster-icon">🧨</span>
        <span>Defuse</span>
        <span class="booster-count" id="count-defuse">3</span>
    </button>
    <button class="booster-btn" id="btn-time" onclick="useTimeExtend()">
        <span class="booster-icon">⏱️</span>
        <span>Time +</span>
        <span class="booster-count" id="count-time">3</span>
    </button>
    <button class="booster-btn" id="btn-auto" onclick="useAutoComplete()">
        <span class="booster-icon">✨</span>
        <span>Auto</span>
        <span class="booster-count" id="count-auto">3</span>
    </button>
</div>

<div id="timer-bar-container">
    <div id="timer-bar"></div>
</div>

<div id="canvas-wrapper">
    <canvas id="gameCanvas" width="400" height="580"></canvas>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        });
    }

    document.addEventListener('touchmove', (e) => { if(e.touches.length > 1) e.preventDefault(); }, { passive: false });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const modeTagEl = document.getElementById('mode-tag');
    const timerBarContainer = document.getElementById('timer-bar-container');
    const timerBar = document.getElementById('timer-bar');
    const menuOverlay = document.getElementById('menu-overlay');
    const toastAlert = document.getElementById('toast-alert');

    const btnDefuse = document.getElementById('btn-defuse');
    const btnTime = document.getElementById('btn-time');
    const countDefuseEl = document.getElementById('count-defuse');
    const countTimeEl = document.getElementById('count-time');
    const countAutoEl = document.getElementById('count-auto');

    const GRID_SIZE = 8;
    const CELL_SIZE = 44;
    const GRID_OFFSET_X = 24;
    const GRID_OFFSET_Y = 24;
    
    let score = 0;
    let currentGameMode = 'classic';
    let bestScore = 0;

    // Track state to avoid repeatedly giving the score milestone
    let nextScoreMilestone = 1000; 

    let boosters = {
        defuse: 3,
        time: 3,
        auto: 3
    };

    let grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));

    const SHAPES = [
        { blocks: [[1]], color: '#FF3B30' }, 
        { blocks: [[1, 1]], color: '#34C759' }, 
        { blocks: [[1], [1]], color: '#34C759' }, 
        { blocks: [[1, 1, 1]], color: '#007AFF' }, 
        { blocks: [[1], [1], [1]], color: '#007AFF' },
        { blocks: [[1, 1], [1, 1]], color: '#FFCC00' }, 
        { blocks: [[1, 1, 1], [0, 1, 0]], color: '#AF52DE' }, 
        { blocks: [[1, 0], [1, 0], [1, 1]], color: '#FF9500' }, 
        { blocks: [[1, 1], [0, 1], [0, 1]], color: '#FF2D55' }  
    ];

    let choices = [null, null, null];
    const CHOICE_Y = 440;
    const CHOICE_X_SPOTS = [40, 160, 280];
    const CHOICE_MAX_WIDTH = 80;

    let dragIdx = -1;
    let dragX = 0;
    let dragY = 0;
    let isDragging = false;

    let timeRemaining = 100; 
    let timerInterval = null;

    function startGame(mode) {
        currentGameMode = mode;
        menuOverlay.style.display = 'none';
        modeTagEl.innerText = mode;
        nextScoreMilestone = 1000; // Reset milestone threshold tracking

        bestScore = localStorage.getItem(`block_smash_best_${mode}`) || 0;
        bestEl.innerText = bestScore;

        btnDefuse.disabled = (mode !== 'blast');
        btnTime.disabled = (mode !== 'timed');

        updateBoosterUI();

        if (mode === 'timed') {
            timerBarContainer.style.display = 'block';
            timeRemaining = 100;
            startTimedTicker();
        } else {
            timerBarContainer.style.display = 'none';
            clearInterval(timerInterval);
        }

        init();
    }

    function triggerToast(message) {
        toastAlert.innerText = message;
        toastAlert.style.display = 'block';
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]); // Reward double vibration pulse
        
        setTimeout(() => {
            toastAlert.style.display = 'none';
        }, 2000);
    }

    function updateBoosterUI() {
        countDefuseEl.innerText = boosters.defuse;
        countTimeEl.innerText = boosters.time;
        countAutoEl.innerText = boosters.auto;
    }

    function startTimedTicker() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeRemaining -= 1.5; 
            if (timeRemaining <= 0) {
                timeRemaining = 0;
                gameOver("Time's Up!");
            }
            timerBar.style.width = `${timeRemaining}%`;
        }, 150);
    }

    function init() {
        grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
        score = 0;
        scoreEl.innerText = score;
        generateChoices();
        draw();
    }

    function useDefuse() {
        if (currentGameMode !== 'blast' || boosters.defuse <= 0) return;
        let defusedCount = 0;
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                if (typeof grid[r][c] === 'object' && grid[r][c].type === 'bomb') {
                    grid[r][c] = '#555555'; 
                    defusedCount++;
                }
            }
        }
        if (defusedCount > 0) {
            boosters.defuse--;
            updateBoosterUI();
            if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
            draw();
        }
    }

    function useTimeExtend() {
        if (currentGameMode !== 'timed' || boosters.time <= 0) return;
        boosters.time--;
        timeRemaining = Math.min(100, timeRemaining + 25); 
        timerBar.style.width = `${timeRemaining}%`;
        updateBoosterUI();
        if (navigator.vibrate) navigator.vibrate([15, 10, 50]);
    }

    function useAutoComplete() {
        if (boosters.auto <= 0) return;
        let targetType = ''; 
        let indexTarget = -1;
        let maxCount = -1;

        for (let r = 0; r < GRID_SIZE; r++) {
            let filledCount = grid[r].filter(cell => cell !== 0).length;
            if (filledCount > maxCount && filledCount < GRID_SIZE && filledCount > 0) {
                maxCount = filledCount;
                targetType = 'row';
                indexTarget = r;
            }
        }

        for (let c = 0; c < GRID_SIZE; c++) {
            let filledCount = 0;
            for (let r = 0; r < GRID_SIZE; r++) {
                if (grid[r][c] !== 0) filledCount++;
            }
            if (filledCount > maxCount && filledCount < GRID_SIZE && filledCount > 0) {
                maxCount = filledCount;
                targetType = 'col';
                indexTarget = c;
            }
        }

        if (indexTarget === -1) {
            targetType = 'row';
            indexTarget = Math.floor(Math.random() * GRID_SIZE);
        }

        if (targetType === 'row') {
            grid[indexTarget].fill('#ffffff'); 
        } else {
            for (let r = 0; r < GRID_SIZE; r++) grid[r][indexTarget] = '#ffffff';
        }

        boosters.auto--;
        updateBoosterUI();
        draw();

        setTimeout(() => {
            if (targetType === 'row') {
                grid[indexTarget].fill(0);
            } else {
                for (let r = 0; r < GRID_SIZE; r++) grid[r][indexTarget] = 0;
            }
            score += 100; 
            scoreEl.innerText = score;
            if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
            draw();
            checkGameOver();
        }, 150);
    }

    function generateChoices() {
        for (let i = 0; i < 3; i++) {
            if (choices[i] === null) {
                const randShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
                choices[i] = JSON.parse(JSON.stringify(randShape)); 
            }
        }
    }

    function canFitSomewhere(shape) {
        if (!shape) return true;
        for (let r = 0; r <= GRID_SIZE - shape.blocks.length; r++) {
            for (let c = 0; c <= GRID_SIZE - shape.blocks[0].length; c++) {
                if (canPlace(shape, r, c)) return true;
            }
        }
        return false;
    }

    function gameOver(reason) {
        clearInterval(timerInterval);
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        alert(`Game Over! ${reason}\nFinal Score: ${score}`);
        
        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem(`block_smash_best_${currentGameMode}`, bestScore);
            bestEl.innerText = bestScore;
        }
        
        menuOverlay.style.display = 'flex';
    }

    function checkGameOver() {
        let anyFit = false;
        for (let i = 0; i < 3; i++) {
            if (choices[i] && canFitSomewhere(choices[i])) {
                anyFit = true;
                break;
            }
        }
        if (!anyFit && choices.some(c => c !== null)) {
            gameOver("No moves left!");
        }
    }

    function drawBlock(x, y, size, cell, isGhost = false) {
        ctx.save();
        if (isGhost) ctx.globalAlpha = 0.3;
        
        let color = (typeof cell === 'object') ? cell.color : cell;

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(x + 1, y + 1, size - 2, size - 2, 6);
        ctx.fill();

        if (!isGhost) {
            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.beginPath();
            ctx.roundRect(x + 2, y + 2, size - 4, 6, 2);
            ctx.fill();

            if (typeof cell === 'object' && cell.type === 'bomb') {
                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${Math.floor(size * 0.45)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(cell.timer, x + size/2, y + size/2 + 1);
            }
        }

        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#1e1e28';
        ctx.beginPath();
        ctx.roundRect(GRID_OFFSET_X - 6, GRID_OFFSET_Y - 6, (GRID_SIZE * CELL_SIZE) + 12, (GRID_SIZE * CELL_SIZE) + 12, 16);
        ctx.fill();
        
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                let x = GRID_OFFSET_X + c * CELL_SIZE;
                let y = GRID_OFFSET_Y + r * CELL_SIZE;
                if (grid[r][c] === 0) {
                    ctx.fillStyle = '#252532';
                    ctx.beginPath();
                    ctx.roundRect(x + 1.5, y + 1.5, CELL_SIZE - 3, CELL_SIZE - 3, 6);
                    ctx.fill();
                } else {
                    drawBlock(x, y, CELL_SIZE, grid[r][c]);
                }
            }
        }

        let snapRow = -1, snapCol = -1;
        if (isDragging && dragIdx !== -1) {
            let shape = choices[dragIdx];
            let offsetX = (shape.blocks[0].length * CELL_SIZE) / 2;
            let offsetY = (shape.blocks.length * CELL_SIZE) + 35; 
            let targetX = dragX - offsetX;
            let targetY = dragY - offsetY;
            snapCol = Math.round((targetX - GRID_OFFSET_X) / CELL_SIZE);
            snapRow = Math.round((targetY - GRID_OFFSET_Y) / CELL_SIZE);

            if (canPlace(shape, snapRow, snapCol)) {
                for (let r = 0; r < shape.blocks.length; r++) {
                    for (let c = 0; c < shape.blocks[r].length; c++) {
                        if (shape.blocks[r][c]) {
                            let gx = GRID_OFFSET_X + (snapCol + c) * CELL_SIZE;
                            let gy = GRID_OFFSET_Y + (snapRow + r) * CELL_SIZE;
                            drawBlock(gx, gy, CELL_SIZE, shape.color, true);
                        }
                    }
                }
            }
        }

        ctx.fillStyle = '#12121a';
        ctx.beginPath();
        ctx.roundRect(16, CHOICE_Y - 10, canvas.width - 32, 130, 20);
        ctx.fill();

        for (let i = 0; i < 3; i++) {
            if (choices[i] && dragIdx !== i) {
                let shape = choices[i];
                let miniCellSize = 18; 
                let sWidth = shape.blocks[0].length * miniCellSize;
                let sHeight = shape.blocks.length * miniCellSize;
                let startX = CHOICE_X_SPOTS[i] + (CHOICE_MAX_WIDTH - sWidth) / 2;
                let startY = CHOICE_Y + (110 - sHeight) / 2;

                for (let r = 0; r < shape.blocks.length; r++) {
                    for (let c = 0; c < shape.blocks[r].length; c++) {
                        if (shape.blocks[r][c]) {
                            drawBlock(startX + c * miniCellSize, startY + r * miniCellSize, miniCellSize, shape.color);
                        }
                    }
                }
            }
        }

        if (isDragging && dragIdx !== -1) {
            let shape = choices[dragIdx];
            let offsetX = (shape.blocks[0].length * CELL_SIZE) / 2;
            let offsetY = (shape.blocks.length * CELL_SIZE) + 35; 

            for (let r = 0; r < shape.blocks.length; r++) {
                for (let c = 0; c < shape.blocks[r].length; c++) {
                    if (shape.blocks[r][c]) {
                        let bx = dragX - offsetX + c * CELL_SIZE;
                        let by = dragY - offsetY + r * CELL_SIZE;
                        drawBlock(bx, by, CELL_SIZE, shape.color);
                    }
                }
            }
        }
    }

    function canPlace(shape, row, col) {
        for (let r = 0; r < shape.blocks.length; r++) {
            for (let c = 0; c < shape.blocks[r].length; c++) {
                if (shape.blocks[r][c]) {
                    if (row + r >= GRID_SIZE || col + c >= GRID_SIZE || row + r < 0 || col + c < 0) return false;
                    if (grid[row + r][col + c] !== 0) return false;
                }
            }
        }
        return true;
    }

    function placeShape(shape, row, col) {
        let points = 0;
        let isSpawnBombTurn = (currentGameMode === 'blast' && Math.random() < 0.25); 

        for (let r = 0; r < shape.blocks.length; r++) {
            for (let c = 0; c < shape.blocks[r].length; c++) {
                if (shape.blocks[r][c]) {
                    if (isSpawnBombTurn) {
                        grid[row + r][col + c] = { type: 'bomb', color: '#3a0007', timer: 8 };
                        isSpawnBombTurn = false; 
                    } else {
                        grid[row + r][col + c] = shape.color;
                    }
                    points++;
                }
            }
        }
        score += points;

        if (currentGameMode === 'blast') tickBombs();
        checkLines();
        if (currentGameMode === 'timed') timeRemaining = Math.min(100, timeRemaining + (points * 2.0)); 

        // --- Milestone Reward checks ---
        if (score >= nextScoreMilestone) {
            boosters.auto++;
            nextScoreMilestone += 1000; 
            updateBoosterUI();
            triggerToast("+1 Auto-Clear Earned! ✨");
        }
    }

    function tickBombs() {
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                let cell = grid[r][c];
                if (typeof cell === 'object' && cell.type === 'bomb') {
                    cell.timer--;
                    if (cell.timer <= 0) {
                        draw();
                        setTimeout(() => { gameOver("A bomb exploded!"); }, 10);
                    }
                }
            }
        }
    }

    function checkLines() {
        let rowsToRemove = [];
        let colsToRemove = [];

        for (let r = 0; r < GRID_SIZE; r++) {
            if (grid[r].every(cell => cell !== 0)) rowsToRemove.push(r);
        }
        for (let c = 0; c < GRID_SIZE; c++) {
            let colFull = true;
            for (let r = 0; r < GRID_SIZE; r++) {
                if (grid[r][c] === 0) { colFull = false; break; }
            }
            if (colFull) colsToRemove.push(c);
        }

        rowsToRemove.forEach(r => grid[r].fill(0));
        colsToRemove.forEach(c => {
            for (let r = 0; r < GRID_SIZE; r++) grid[r][c] = 0;
        });

        let linesCleared = rowsToRemove.length + colsToRemove.length;
        if (linesCleared > 0) {
            score += linesCleared * 25 * linesCleared; 
            
            if (currentGameMode === 'timed') {
                timeRemaining = Math.min(100, timeRemaining + (linesCleared * 12)); 
                // Double Combo or better rewards a booster item
                if (linesCleared >= 2) {
                    boosters.time++;
                    updateBoosterUI();
                    triggerToast("Combo! +1 Time item Earned! ⏱️");
                }
            }

            if (currentGameMode === 'blast') {
                if (linesCleared >= 2) {
                    boosters.defuse++;
                    updateBoosterUI();
                    triggerToast("Combo! +1 Defuse item Earned! 🧨");
                }
            }

            if (navigator.vibrate) navigator.vibrate([40, 30, 40]);
        }
        scoreEl.innerText = score;
    }

    function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    function handleStart(e) {
        const coords = getCanvasCoords(e);
        for (let i = 0; i < 3; i++) {
            if (choices[i]) {
                let xStart = CHOICE_X_SPOTS[i];
                let xEnd = xStart + CHOICE_MAX_WIDTH;
                let yStart = CHOICE_Y - 10;
                let yEnd = CHOICE_Y + 120;

                if (coords.x >= xStart && coords.x <= xEnd && coords.y >= yStart && coords.y <= yEnd) {
                    dragIdx = i;
                    isDragging = true;
                    dragX = coords.x;
                    dragY = coords.y;
                    if (navigator.vibrate) navigator.vibrate(15);
                    break;
                }
            }
        }
    }

    function handleMove(e) {
        if (!isDragging) return;
        const coords = getCanvasCoords(e);
        dragX = coords.x;
        dragY = coords.y;
        draw();
    }

    function handleEnd(e) {
        if (!isDragging) return;
        
        let shape = choices[dragIdx];
        let offsetX = (shape.blocks[0].length * CELL_SIZE) / 2;
        let offsetY = (shape.blocks.length * CELL_SIZE) + 35;

        let targetX = dragX - offsetX;
        let targetY = dragY - offsetY;

        let col = Math.round((targetX - GRID_OFFSET_X) / CELL_SIZE);
        let row = Math.round((targetY - GRID_OFFSET_Y) / CELL_SIZE);

        if (canPlace(shape, row, col)) {
            placeShape(shape, row, col);
            choices[dragIdx] = null;
            if (choices.every(c => c === null)) generateChoices();
        }
        
        isDragging = false;
        dragIdx = -1;
        draw();
        setTimeout(checkGameOver, 100);
    }

    canvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchstart', handleStart, { passive: false });
    window.addEventListener('touchmove', handleMove, { passive: false });
    window.addEventListener('touchend', handleEnd, { passive: false });
</script>
